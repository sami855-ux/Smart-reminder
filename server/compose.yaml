services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smart_reminder
      POSTGRES_PASSWORD: smart_reminder
      POSTGRES_USER: smart_reminder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_reminder -d smart_reminder"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - smart_reminder_postgres:/var/lib/postgresql/data

volumes:
  smart_reminder_postgres:
